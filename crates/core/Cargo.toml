[package]
name = "uncharted_core"
description = "The launcher's engine: dump checks, prepare, patches, saves, Steam shortcuts, build hubs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "uncharted_core"
path = "src/lib.rs"

[features]
# `relay` (src/relay.rs, planned, not in the tree yet) links iannitram/save-relay's library;
# its issue adds the module, the dependency and this feature.
# `hub` is the build hub on the home network (src/hub.rs, ADR 0004); its issues add the
# pure-Rust crates it needs (mdns-sd, RustCrypto spake2, chacha20poly1305, sha2).
hub = []

# Core dependencies are pure Rust and add no native libraries or platform SDK requirements.
[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.25", default-features = false }
serde_json = "1"
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }
