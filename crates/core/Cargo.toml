[package]
name = "uncharted_core"
description = "The launcher's engine: dump checks, prepare, patches, saves, Steam shortcuts, build hubs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "uncharted_core"
path = "src/lib.rs"

[features]
# `relay` (src/relay.rs, planned, not in the tree yet) links iannitram/save-relay's library;
# its issue adds the module, the dependency and this feature.
# `hub` is the build hub on the home network (src/hub.rs, ADR 0004); discovery and the bundle
# transfer service still need mDNS integration, while pairing/game-data crypto is implemented.
hub = ["dep:chacha20poly1305", "dep:getrandom", "dep:hmac", "dep:sha2", "dep:spake2"]

# Core dependencies are pure Rust and add no native libraries or platform SDK requirements.
[dependencies]
serde_json = "1"
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "=0.10.1", optional = true }
getrandom = { version = "=0.2.16", optional = true }
hmac = { version = "=0.12.1", optional = true }
sha2 = { version = "=0.10.8", optional = true }
spake2 = { version = "=0.4.0", optional = true }
