[package]
name = "uncharted_core"
description = "The launcher's engine: dump checks, prepare, patches, saves, Steam shortcuts, build hubs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "uncharted_core"
path = "src/lib.rs"

[features]
# `relay` (src/relay.rs, planned, not in the tree yet) links iannitram/save-relay's library;
# its issue adds the module, the dependency and this feature.
# `hub` is the build hub on the home network (src/hub.rs, ADR 0004): mDNS discovery and
# announce (`mdns-sd`, Apache-2.0 OR MIT, pure Rust), pairing, and the sealed game-data and
# bundle transfers are implemented; the service listener and CLI wiring are not.
hub = [
    "dep:chacha20poly1305",
    "dep:fs4",
    "dep:getrandom",
    "dep:hmac",
    "dep:mdns-sd",
    "dep:sha2",
    "dep:spake2",
]

# Core dependencies are pure Rust and add no native libraries or platform SDK requirements.
[dependencies]
serde_json = "1"
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "=0.10.1", optional = true }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"], optional = true }
getrandom = { version = "=0.2.16", optional = true }
hmac = { version = "=0.12.1", optional = true }
mdns-sd = { version = "=0.21.7", default-features = false, optional = true }
sha2 = { version = "=0.10.8", optional = true }
spake2 = { version = "=0.4.0", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
