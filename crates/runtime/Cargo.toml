[package]
name = "uncharted_runtime"
description = "The host runtime that replaces src/*.c module by module (ADR 0002)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "uncharted_runtime"
path = "src/lib.rs"
# A static library linked into the loader while C remains (ADR 0002); rlib for the Rust tests.
# build.rs: the NID table, the loader cfg (UNCHARTED_RUNTIME_LOADER=1) and the gpu/ build.
crate-type = ["rlib", "staticlib"]

# The desktop runner. Only `--probe` is built; the game loader joins it in piece 3.16.
[[bin]]
name = "uncharted-run"
path = "src/bin/uncharted-run.rs"

[dependencies]
uncharted_core = { path = "../core" }
# Escape the three player-visible save strings without ever serializing a guest buffer.
serde_json = "1"
# Vulkan for `uncharted-run --probe` (#171), loaded at run time: a machine without a Vulkan
# loader gets an error message, not a missing-library failure. MIT or Apache-2.0.
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
# SDL3 audio streams for `audio` (piece 3.07); zlib. The raw bindings, not the `sdl3` crate (MIT):
# `no-link` because the loader already links SDL3 (build.sh, gpu/CMakeLists.txt), and only the
# loader build calls it (`cfg(uncharted_loader)`), so tests and the mobile builds need no SDL.
sdl3-sys = { version = "0.7", default-features = false, features = ["no-link"] }
# OS random bytes for `os::random_bytes` (roadmap 3.15; BCryptGenRandom on Windows). MIT or Apache-2.0.
getrandom = "0.3"
# MP3 decoding for `ajm` (piece 3.08), replacing FFmpeg (#299): pure Rust, MPL-2.0, which
# the GPL-2.0-only project may combine with (MPL-2.0 section 3.3 lists GPL-2.0 as a Secondary
# License). Only the codec's own decoder is used, no demuxer or container crate.
symphonia-bundle-mp3 = { version = "0.5", default-features = false, features = ["mp3"] }
symphonia-core = { version = "0.5", default-features = false }

[dev-dependencies]
# Writes and checks include/uncharted_runtime.h (tests/header.rs); MPL-2.0, a test-only tool.
cbindgen = { version = "0.29", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Threading"] }

# The x86-64 decoder of `cpu_patch` and `red_zone` (piece 3.14), replacing Zydis there; MIT.
# Decoder and instruction info only, so no encoder, assembler or formatter is built.
[target.'cfg(target_arch = "x86_64")'.dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }

# mmap, memfd_create and fallocate for the guest address space (`memory::linux`, piece 3.12).
# MIT or Apache-2.0.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
