# The C header of the runtime's exported symbols: include/uncharted_runtime.h, written by
# `cbindgen` from this crate (tests/header.rs checks it is current; UNCHARTED_WRITE_HEADER=1
# rewrites it). src/runtime.h includes it for the C modules that remain.
language = "C"
cpp_compat = true
include_guard = "UNCHARTED_RUNTIME_H"
autogen_warning = "/* Generated by cbindgen from crates/runtime (tests/header.rs). Do not edit. */"
documentation_style = "c99"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true

[defines]
# Only x86-64 hosts run guest code (src/abi.rs).
"target_arch = x86_64" = "__x86_64__"

[export]
# The benchmark glue keeps its own declarations (src/runtime_benchmark.c, #173).
exclude = [
    "uncharted_benchmark_start",
    "uncharted_benchmark_active",
    "uncharted_benchmark_pad",
    "uncharted_benchmark_frame",
    "uncharted_benchmark_crash",
]
item_types = ["functions", "constants", "structs"]

[fn]
sort_by = "None"
