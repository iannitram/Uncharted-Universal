[package]
name = "uncharted_cli"
description = "uncharted-universal: the command-line face of the launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uncharted-universal"
path = "src/main.rs"

[features]
# `hub serve|pair|pull` over the network (uncharted_core's `hub`: mDNS, pairing, sealed pulls).
# Without it the hub commands check their arguments and end with "not built yet" (status 3).
hub = ["uncharted_core/hub"]

[dependencies]
# `hub`: `setup client` pairs with a hub and pulls the prepared games.
uncharted_core = { path = "../core", features = ["hub"] }
serde_json = "1"
