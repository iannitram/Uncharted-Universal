[package]
name = "uncharted-app"
description = "The launcher: Rust + Slint (ADR 0003). The after-crash screen (2.07); the Continue screen is piece 2.04."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uncharted-app"
path = "src/main.rs"

# Slint is used under its royalty-free licence; the About line in ui/app.slint shows its notice.
[dependencies]
slint = "1.18.1"
gilrs = "0.11.2"
serde_json = "1"
uncharted_core = { path = "../crates/core" }

[build-dependencies]
slint-build = "1.18.1"
