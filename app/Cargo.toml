[package]
name = "uncharted-app"
description = "The launcher: Rust + Slint (ADR 0003). The Continue screen (piece 2.04) and the guided first run (2.05)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uncharted-app"
path = "src/main.rs"

# Slint is used under its royalty-free licence; the About line in ui/app.slint shows its notice.
[dependencies]
slint = "1.18.1"
gilrs = "0.11.2"
# `hub`: the first run pairs with a hub and pulls the prepared games (setup::client).
uncharted_core = { path = "../crates/core", features = ["hub"] }
# The device's time zone for "Saved today 21:14".
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
# The headless Slint run of the page in `cargo test`; same version as slint.
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "1.18.1"
