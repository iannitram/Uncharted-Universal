[package]
name = "uncharted-app"
description = "The launcher: Rust + Slint (ADR 0003). Scaffold, About and the seven languages; the Continue screen is piece 2.04."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uncharted-app"
path = "src/main.rs"

# Slint is used under its royalty-free licence; the About screen in ui/app.slint shows its
# notice. Every dependency is listed in About (src/vm/about.rs) and in ROADMAP.md's licence table.
[dependencies]
slint = "1.18.1"
gilrs = "0.11.2"
# The system locale for the Automatic interface language; Slint already depends on it.
sys-locale = "0.3.2"
uncharted_core = { path = "../crates/core" }

[dev-dependencies]
# Builds the window without a display, for the translation and About tests in src/main.rs.
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "1.18.1"
