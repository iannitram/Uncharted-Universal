[package]
name = "uncharted-app"
description = "The launcher: Rust + Slint (ADR 0003). The Continue screen (piece 2.04), the guided first run (2.05), Saves and Settings (2.06), the Fleet page (2.08), About and the seven languages (2.09) and the after-crash screen (2.07)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uncharted-app"
path = "src/main.rs"

# Slint is used under its royalty-free licence; the About screen in ui/app.slint shows its
# notice. Every dependency is listed in About (src/vm/about.rs) and in ROADMAP.md's licence table.
[dependencies]
slint = "1.18.1"
gilrs = "0.11.2"
# The system locale for the Automatic interface language; Slint already depends on it.
sys-locale = "0.3.2"
# `hub`: the first run pairs with a hub and pulls the prepared games (setup::client).
uncharted_core = { path = "../crates/core", features = ["hub"] }
# The device's time zone for "Saved today 21:14".
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# settings.json, tune.json and the benchmark reports.
serde_json = "1"

[dev-dependencies]
# The headless Slint runs of the window in `cargo test` (src/main.rs); same version as slint.
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "1.18.1"
