name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    name: Linux GPU and C tests
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build.yml
    # The reusable workflow declares contents: write for main releases; scope its caller grant here.
    permissions:
      contents: write
    with:
      ref: ${{ github.sha }}

  rust:
    # A public repo: CI runs on GitHub-hosted runners (R29). The Rust workspace is built and
    # tested on Linux, Windows and macOS on every push and pull request.
    # The C and GPU build stays in build.yml.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      - name: Run the DLSS settings fallback regression test
        if: matrix.os == 'linux'
        run: |
          c++ -std=c++20 -O2 -g -Wall -Wextra -Werror -pthread -Igpu/shim \
            tests/test_upscaler_support.cpp gpu/shim/bbport_settings.cpp -o /tmp/upscaler-support-test
          /tmp/upscaler-support-test

  native-windows:
    # CLANG64 builds the Windows GPU library and runs the GPU unit targets and portable native C harnesses (the Python suite is not yet Windows-ready); it is not a hardware GPU test.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths for Git checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install CLANG64 build dependencies
        run: |
          source ./msys2-env.sh
          pacman -S --needed --noconfirm git patch \
            mingw-w64-clang-x86_64-{toolchain,cmake,ninja,pkgconf,python} \
            mingw-w64-clang-x86_64-{vulkan-headers,vulkan-loader,vulkan-memory-allocator,glslang} \
            mingw-w64-clang-x86_64-{sdl3,fmt,spdlog,boost,robin-map,xxhash,ffmpeg,zydis} \
            mingw-w64-clang-x86_64-{spirv-tools,spirv-headers,spirv-cross} \
            mingw-w64-clang-x86_64-{protobuf,openssl,zlib,miniupnpc,nlohmann-json}
      - name: Build GPU library and run portable C harnesses
        run: BB_JOBS=2 bash build.sh --test

  android:
    # The runtime cross-builds for Android (SPEC.md M6, ROADMAP 7.02). A static library needs no
    # target linker, so no NDK is installed yet; host build scripts (serde_json's) use the
    # runner's `cc`. When the runtime links C (piece 3.01) this job gets the NDK. `--lib`:
    # Android embeds the runtime, so the desktop `uncharted-run` binary is not linked here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo build -p uncharted_runtime --lib --target aarch64-linux-android

  ios:
    # The runtime checks for iOS (ROADMAP 8.02); `check` because nothing links an iOS binary yet.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo check --target aarch64-apple-ios -p uncharted_runtime
