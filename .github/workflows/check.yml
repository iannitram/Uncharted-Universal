name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    name: Linux GPU and C tests
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build.yml
    # The reusable workflow declares contents: write for main releases; scope its caller grant here.
    permissions:
      contents: write
    with:
      ref: ${{ github.sha }}

  rust:
    # A private repo: CI runs on our own self-hosted runners (R29). The Rust workspace runs on
    # Linux and Windows here; macOS workspace checks and native platform checks have separate jobs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: [self-hosted, linux]
          - os: windows
            runner: [self-hosted, windows]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install build tools
        # The self-hosted Linux runner image has no C toolchain; Rust build scripts need `cc` to link.
        if: matrix.os == 'linux'
        run: SUDO=$(command -v sudo || true); $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends build-essential curl ca-certificates
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runners share the host CARGO_HOME; restoring ~/.cargo/bin would replace the rustup proxies.
          cache-bin: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features

  rust-macos:
    # Workspace check only. GPU, Vulkan and hardware validation remain platform-specific jobs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runners share the host CARGO_HOME; restoring ~/.cargo/bin would replace the rustup proxies.
          cache-bin: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features

  native-windows:
    # CLANG64 builds the Windows GPU library and portable native C harnesses; it is not a hardware GPU test.
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths for Git checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the missing CLANG64 Protobuf development package
        run: source ./msys2-env.sh && pacman -S --needed --noconfirm mingw-w64-clang-x86_64-protobuf
      - name: Build GPU library and run portable C harnesses
        run: BB_JOBS=2 bash build.sh --test
      - name: Run Python tests and enforce the Windows expected-skip list
        run: source ./msys2-env.sh && python3 --version && python3 tools/ci_unittest.py --platform windows

  android:
    # The runtime cross-builds for Android (SPEC.md M6, ROADMAP 7.02). A static library needs no
    # target linker, so no NDK is installed yet; host build scripts (serde_json's) still need the
    # runner's `cc`. When the runtime links C (piece 3.01) this job gets the NDK.
    runs-on: [self-hosted, linux]
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install build tools
        # The self-hosted Linux runner image has no C toolchain; host build scripts need `cc` to link.
        run: SUDO=$(command -v sudo || true); $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends build-essential curl ca-certificates
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runners share the host CARGO_HOME; restoring ~/.cargo/bin would replace the rustup proxies.
          cache-bin: false
      - run: cargo build -p uncharted_runtime --target aarch64-linux-android

  ios:
    # The runtime checks for iOS (ROADMAP 8.02); `check` because nothing links an iOS binary yet.
    # Dispatch-only (macOS bills at 10x); moves to [self-hosted, macos] when the Mac mini runner is online (R29).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runners share the host CARGO_HOME; restoring ~/.cargo/bin would replace the rustup proxies.
          cache-bin: false
      - run: cargo check --target aarch64-apple-ios -p uncharted_runtime
