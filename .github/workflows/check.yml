name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    name: Linux GPU and C tests
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build.yml
    # The reusable workflow declares contents: write for main releases; scope its caller grant here.
    permissions:
      contents: write
    with:
      ref: ${{ github.sha }}

  rust:
    # A public repo: CI runs on GitHub-hosted runners (R29). The Rust workspace is built and
    # tested on Linux, Windows and macOS on every push and pull request. That includes app/
    # (`uncharted-app`, the Slint launcher), which the workspace-wide steps below build and lint.
    # The C and GPU build stays in build.yml.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Enforce no Python runtime files (roadmap 2.11)
        run: |
          if [ -d launcher ] || [ -d scripts ] || [ -f run.py ] || [ -f run.sh ]; then
            echo "Python runtime path found" >&2
            exit 1
          fi
          py_runtime=$(find . -name "*.py" -not -path "*/.*" -not -path "./tools/*" -not -path "./tests/*" -not -path "./packaging/*" -not -path "./gpu/third_party/*" 2>/dev/null || true)
          if [ -n "$py_runtime" ]; then
            echo "Python runtime file(s) found: $py_runtime" >&2
            exit 1
          fi
      - name: Install Slint and gilrs system packages (Linux)
        # app/ (Slint + gilrs): udev for gilrs; fontconfig, freetype, xkbcommon and the
        # X11/Wayland/GL headers for Slint's winit and femtovg backends.
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libxcb1-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev libgl1-mesa-dev \
            libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Lint crates/runtime as the loader links it (cfg(uncharted_loader), crates/runtime/build.rs)
        # The cfg alone: UNCHARTED_GPU_BUILD would also build gpu/, which this job does not.
        run: cargo clippy -p uncharted_runtime --lib -- -D warnings --cfg uncharted_loader
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      - name: Smoke-run the uncharted-universal commands
        # Every command once on a synthetic dump with its exit status (crates/cli/tests/cli.rs,
        # also part of the workspace tests above; named here so a CLI break shows on its own).
        run: |
          cargo run -q -p uncharted_cli -- --help
          cargo test -p uncharted_cli --test cli
      - name: Run the fake hub on loopback
        # `hub serve` on 127.0.0.1 with a synthetic build; a second copy of the binary pairs and
        # pulls (crates/cli/tests/hub_loopback.rs), and the core service test runs the same flow
        # in-process (crates/core/tests/hub_service.rs). Windows checks that paired-device
        # storage fails closed before any connection, until its ACL work lands.
        run: |
          cargo test -p uncharted_cli --features hub --test hub_loopback
          cargo test -p uncharted_core --features hub --test hub_service
      - name: Build the launcher and run its Fleet page tests (2.08)
        # Named so a broken Fleet page shows up by name; the workspace steps above already
        # build and test app/ with everything else.
        run: |
          cargo build -p uncharted-app
          cargo test -p uncharted-app -- vm::fleet focus::
      - name: Run the DLSS settings fallback regression test
        if: matrix.os == 'linux'
        run: |
          c++ -std=c++20 -O2 -g -Wall -Wextra -Werror -pthread -Igpu/shim \
            tests/test_upscaler_support.cpp gpu/shim/bbport_settings.cpp -o /tmp/upscaler-support-test
          /tmp/upscaler-support-test
      - name: C-side link check of crates/runtime's file module (Linux)
        # tests/test_file_mods.c against the plain static library (no loader cfg, no C runtime):
        # the cbindgen header's file symbols link and keep the C contract (piece 3.09).
        if: matrix.os == 'linux'
        run: |
          cargo build -p uncharted_runtime --lib
          cc -std=c11 -O2 -g -Wall -Wextra -Werror -pthread tests/test_file_mods.c \
            target/debug/libuncharted_runtime.a -lgcc_s -lutil -lrt -lpthread -lm -ldl \
            -o /tmp/file-mods-test
          /tmp/file-mods-test
      - name: C++ FEX guest-call bridge ABI link test (#209, Linux)
        if: matrix.os == 'linux'
        run: |
          c++ -std=c++20 -O2 -g -Wall -Wextra -Werror -pthread -I. \
            tests/test_android_fex_bridge.cpp android/fex_bridge.cpp \
            target/debug/libuncharted_runtime.a -lgcc_s -lutil -lrt -lpthread -lm -ldl \
            -o /tmp/android-fex-bridge-test
          /tmp/android-fex-bridge-test
      - name: Build the runtime library for aarch64-apple-darwin (8.02, macOS)
        # The Mac app links this library (8.05). The runner must be arm64: the check fails on any
        # other architecture, so the Mac build is known to be Apple silicon. gpu/ is not built here
        # (UNCHARTED_GPU_BUILD stays unset; crates/runtime/build.rs).
        if: matrix.os == 'macos'
        run: |
          echo "runner architecture: $(uname -m)"
          test "$(uname -m)" = arm64
          rustup target add aarch64-apple-darwin
          cargo build -p uncharted_runtime --lib --target aarch64-apple-darwin

  native-windows:
    # CLANG64 builds the Windows GPU library and runs the GPU unit targets and portable native C harnesses (the Python suite is not yet Windows-ready); it is not a hardware GPU test.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths for Git checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install CLANG64 build dependencies
        run: |
          source ./msys2-env.sh
          pacman -S --needed --noconfirm git patch \
            mingw-w64-clang-x86_64-{toolchain,cmake,ninja,pkgconf,python} \
            mingw-w64-clang-x86_64-{vulkan-headers,vulkan-loader,vulkan-memory-allocator,glslang} \
            mingw-w64-clang-x86_64-{sdl3,fmt,spdlog,boost,robin-map,xxhash,ffmpeg,zydis} \
            mingw-w64-clang-x86_64-{spirv-tools,spirv-headers,spirv-cross} \
            mingw-w64-clang-x86_64-{protobuf,openssl,zlib,miniupnpc,nlohmann-json}
      - name: Add the Rust target that matches CLANG64 (bb-probe and uncharted-run link crates/runtime)
        run: rustup target add x86_64-pc-windows-gnullvm
      - name: Build GPU library and run portable C harnesses
        run: BB_JOBS=2 bash build.sh --test
      - name: Test the whole Rust workspace on the CLANG64 target (6.01, x86_64-pc-windows-gnullvm)
        # The release zip is built for this target (build.yml), so the workspace is tested on it too;
        # this covers the runtime's Windows shims (os, 3.15) and every other crate. Each step is a
        # new shell: msys2-env.sh puts CLANG64's linker and runtime DLLs on PATH for this target.
        run: |
          source ./msys2-env.sh
          cargo test --workspace --target x86_64-pc-windows-gnullvm

  android:
    # The runtime cross-builds for Android (SPEC.md M6, ROADMAP 7.02). A static library needs no
    # target linker, so no NDK is installed yet; host build scripts (serde_json's) use the
    # runner's `cc`. Since piece 3.01 the loader's static library calls C, but only on x86-64 hosts
    # in the loader build (cfg(uncharted_loader)); the Android library still links no C, so no NDK
    # yet: it comes with the Android app. `--lib`:
    # Android embeds the runtime, so the desktop `uncharted-run` binary is not linked here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo check --target aarch64-linux-android -p uncharted_runtime
      - run: cargo clippy --target aarch64-linux-android -p uncharted_runtime --lib -- -D warnings
      - run: cargo build -p uncharted_runtime --lib --target aarch64-linux-android
      - run: cargo test -p uncharted_runtime --lib android_fex
      - name: Check and test Stage 7.03 Android APK scaffold
        run: |
          cargo fmt --manifest-path android/apk/Cargo.toml --check
          cargo clippy --manifest-path android/apk/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path android/apk/Cargo.toml
          cargo check --manifest-path android/apk/Cargo.toml --target aarch64-linux-android
          cargo build --manifest-path android/apk/Cargo.toml --lib --target aarch64-linux-android
      - name: Validate Android component lock and patch series
        run: bash android/scripts/build_dependencies.sh --check-lock
      - name: Run Android preflight and NDK/SDK setup script self-tests
        run: bash android/scripts/test_preflight_and_setup.sh
      - name: Run synthetic FEX guest smoke harness (host + NDK cross-check if NDK installed)
        run: bash android/scripts/verify_fex_smoke.sh

  ios:
    # The runtime builds as a library for iOS (ROADMAP 8.02, #407); the iOS app links it (8.05).
    # Like the Mac build, the runner must be arm64 (the check fails otherwise). gpu/ is not built
    # (UNCHARTED_GPU_BUILD stays unset; crates/runtime/build.rs). No app is linked here yet.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Check the runner is arm64
        run: |
          echo "runner architecture: $(uname -m)"
          test "$(uname -m)" = arm64
      - run: cargo build --target aarch64-apple-ios -p uncharted_runtime --lib

  apple-nojit-synthetic:
    # #212: synthetic cases through bbcpu's interpreter (BB_JIT=0) on the macOS arm64 runner; a
    # wrong result fails the job. The iOS Simulator run is local-only (see tests/apple_nojit/RESULTS.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: sh tests/apple_nojit/run.sh host nojit-report.json
      - run: cat nojit-report.json
