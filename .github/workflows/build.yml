# Builds the Linux / Steam Deck package. Every build of main is published as a
# release (v<upstream version>-linux.<run>), which the launcher's update check looks for.
name: Build Linux package

on:
  # A push or pull request that only touches these (README edits, notes, the sync workflow)
  # changes nothing in the package, so it is not built or released.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/sync-upstream.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/sync-upstream.yml'
  workflow_dispatch:
  # sync-upstream.yml builds a merge of upstream before it reaches main (no release then).
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.ref || github.ref }}
  # A release build on main runs to the end (a newer push waits behind it); others are replaced.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || inputs.ref != '' }}

jobs:
  build:
    # Self-hosted Linux runner (R29): this repo is private.
    runs-on: [self-hosted, linux]
    # The self-hosted runner is itself a container (no nested Docker) on Ubuntu 24.04, which has no
    # SDL3 package. So the build runs in a Debian 13 chroot (glibc 2.41, no newer than SteamOS 3.7+).
    env:
      CHROOT: /var/tmp/trixie-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: recursive
          fetch-depth: 0
      - name: Debian 13 chroot
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=$(command -v sudo || true)
          if [ ! -x "$CHROOT/usr/bin/apt-get" ]; then
            $SUDO apt-get update -q
            $SUDO apt-get install -yq --no-install-recommends debootstrap ca-certificates
            $SUDO rm -rf "$CHROOT"
            $SUDO debootstrap --variant=minbase trixie "$CHROOT" http://deb.debian.org/debian
          fi
          # No bind mounts or /proc (the runner container is unprivileged): copy the checkout in.
          $SUDO rm -rf "$CHROOT/work"
          $SUDO mkdir -p "$CHROOT/work"
          $SUDO cp -a "$GITHUB_WORKSPACE/." "$CHROOT/work/"
      - name: Dependencies
        run: |
          sudo chroot "$CHROOT" bash -euc '
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends               git ca-certificates curl build-essential cmake ninja-build pkgconf file binutils               python3 python3-venv python3-dev python3-tk               libsdl3-dev libvulkan-dev libfmt-dev libboost-dev robin-map-dev               libvulkan-memory-allocator-dev libxxhash-dev libx11-dev libzydis-dev libzycore-dev               libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev               libprotobuf-dev protobuf-compiler nlohmann-json3-dev libssl-dev zlib1g-dev               libminiupnpc-dev glslang-tools glslang-dev spirv-headers
          '
      - name: Build
        run: |
          sudo chroot "$CHROOT" bash -euc '
            git config --global --add safe.directory "*"
            cd /work
            BB_JOBS=2 CARGO_BUILD_JOBS=2 bash build.sh
          '
      - name: Extract AppImage tool outside the chroot
        # The AppImage runtime needs /proc/self/exe, unavailable in this unprivileged chroot.
        run: |
          staging=$(mktemp -d "$RUNNER_TEMP/appimagetool.XXXXXX")
          trap 'rm -rf "$staging"' EXIT
          curl -fsSL -o "$staging/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x "$staging/appimagetool"
          (cd "$staging" && ./appimagetool --appimage-extract >/dev/null)
          sudo rm -rf "$CHROOT/work/out/appimagetool-extracted"
          sudo cp -a "$staging/squashfs-root" "$CHROOT/work/out/appimagetool-extracted"
      - name: Package
        run: |
          version=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" launcher/uncharted_launcher.py | head -1)
          echo "TAG=v$version-linux.${{ github.run_number }}" >> "$GITHUB_ENV"
          sudo chroot "$CHROOT" bash -euc "
            git config --global --add safe.directory '*'
            cd /work
            APPIMAGETOOL=/work/out/appimagetool-extracted/AppRun LINUX_BUILD='$version-linux.${{ github.run_number }}' bash packaging/linux/package.sh
          "
      - name: Copy dist back to the workspace
        run: |
          sudo mkdir -p "$GITHUB_WORKSPACE/dist"
          sudo cp -a "$CHROOT/work/dist/." "$GITHUB_WORKSPACE/dist/"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          sudo rm -rf "$CHROOT/work"
      - uses: actions/upload-artifact@v4
        with:
          name: uncharted-linux
          path: |
            dist/Uncharted-x86_64.AppImage
            dist/uncharted-linux.tar.gz
      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || sudo apt-get install -yq --no-install-recommends gh >/dev/null
          gh release create "$TAG" dist/Uncharted-x86_64.AppImage dist/uncharted-linux.tar.gz --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Uncharted for Linux/Steam Deck $TAG" \
            --notes "Built from $(git log -1 --format='%h %s'). Install steps: see the README."
