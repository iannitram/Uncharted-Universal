name: apple-ios

# The three per-game iOS apps (#409, ROADMAP 8.05) and their SideStore .ipa files, built by
# apple/build_ios.sh with swiftc (no Xcode project) and checked by apple/check_ios.sh. The apps hold
# no game files. The local-only apple/export_ipas.sh is never run here.

on:
  pull_request:
    paths:
      - "apple/**"
      - "packaging/ios/**"
      - "tests/apple/**"
      - "tools/check_no_game_data.sh"
      - "crates/runtime/include/**"
      - "packaging/save-relay/**"
      - "packaging/rust_licences.py"
      - ".github/workflows/apple-ios.yml"
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "packaging/ios/**"
      - "tests/apple/**"
      - "tools/check_no_game_data.sh"
      - "crates/runtime/include/**"
      - "packaging/save-relay/**"
      - "packaging/rust_licences.py"
      - ".github/workflows/apple-ios.yml"
  workflow_dispatch:

concurrency:
  group: apple-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device:
    # Builds U1, U2 and U3 for iphoneos, checks them, packages them and checks the .ipa files.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Check the runner is arm64
        run: |
          echo "runner architecture: $(uname -m)"
          test "$(uname -m)" = arm64
      - name: Packager and checker tests
        run: bash apple/tests/package_ipa_test.sh
      - name: Build the three apps (iphoneos)
        run: |
          export OUT="$RUNNER_TEMP/ios"
          bash apple/build_ios.sh all iphoneos
      - name: Check the apps (arm64, platform IOS, system libraries only, Save Relay symbols, no game data)
        run: |
          for app in "$RUNNER_TEMP"/ios/iphoneos/*.app; do
            echo "== $app"
            bash apple/check_ios.sh app "$app" device
          done
      - name: Package the .ipa files
        run: |
          mkdir -p "$RUNNER_TEMP/ipas"
          for app in "$RUNNER_TEMP"/ios/iphoneos/*.app; do
            bash apple/package_ipa.sh "0.0.0-ci.${GITHUB_RUN_NUMBER}" "$app" "$RUNNER_TEMP/ipas"
          done
          ls -l "$RUNNER_TEMP/ipas"
      - name: Check the .ipa files (Payload/<App>.app only, ad hoc, no entitlements, no game data)
        run: |
          for ipa in "$RUNNER_TEMP"/ipas/*.ipa; do
            echo "== $ipa"
            bash apple/check_ios.sh ipa "$ipa"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: uncharted-ios-ipas
          path: ${{ runner.temp }}/ipas/*.ipa
          retention-days: 3

  simulator:
    # RelayHost (Keychain and URLSession) and the real Save Relay library inside the iOS Simulator,
    # against a local fake server. It builds the pinned Save Relay tag for the Simulator (the release has
    # no Simulator slice). Not required: Simulator availability on runners is outside our control.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: RelayHost test in the Simulator
        run: bash apple/tests/relay_host_test.sh "$RUNNER_TEMP/relay-host"
      - name: Launch smoke (U1) in the Simulator
        run: bash apple/tests/app_smoke_sim.sh u1 "$RUNNER_TEMP/app-smoke"
